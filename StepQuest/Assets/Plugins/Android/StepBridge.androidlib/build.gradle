// Unity Android library: the native step sampler, notifications and home-screen widget.
apply plugin: 'com.android.library'

android {
    namespace 'com.stepquest.bridge'
    compileSdkVersion 35
    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
}
